apis:
  - name: TrustArc Guardian Identity API
    description: >-
      TrustArc's platform identity, account and access-management service. Publishes a full
      OpenAPI 3.1.0 contract with 205 paths, 276 operations and 158 schemas covering users,
      user profiles, groups, permission profiles, accounts, OAuth clients, SSO/external auth
      configuration, email templates, navigation menus, meta-tagging and licensing — plus a
      standards-compliant SCIM 2.0 provisioning surface at /external/api/v2/scim/ (Users,
      Groups, ServiceProviderConfig, Schemas, ResourceTypes). This is the only TrustArc API
      with a machine-readable contract; the spec is served openly at /v3/api-docs even
      though the Swagger UI that renders it is closed. Auth is OAuth 2.0; the host publishes
      OpenID Connect and RFC 8414 discovery documents advertising authorization_code,
      client_credentials, refresh_token and token exchange, with PKCE, mTLS-bound tokens and
      DPoP.
    humanURL: https://trustarchelp.zendesk.com/hc/en-us/articles/49881862843155-Authorization-and-Authentication
    baseURL: https://login.truste.com
    tags:
      - Identity
      - Authentication
      - OAuth
      - OpenID Connect
      - SCIM
      - User Provisioning
      - Access Management
      - SSO
    properties:
      - type: OpenAPI
        url: openapi/trustarc-guardian-openapi.yml
      - type: Documentation
        url: https://trustarchelp.zendesk.com/hc/en-us/articles/49881862843155-Authorization-and-Authentication
      - type: Authentication
        url: authentication/trustarc-authentication.yml
      - type: OAuthScopes
        url: scopes/trustarc-scopes.yml
      - type: DataModel
        url: data-model/trustarc-data-model.yml
      - type: Overlay
        url: overlays/trustarc-guardian-overlay.yaml
      - type: AgentSkill
