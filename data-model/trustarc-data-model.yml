        - {kind: belongs_to, target: DataSubjectType, via: dataSubjectTypeIds}
      docs: https://trustarchelp.zendesk.com/hc/en-us/articles/40520220419475-External-Consent-Controller
    - name: ConsentManager
      domain: Cookie Consent Manager
      keys: [cmUuid]
      relationships:
        - {kind: has_many, target: Website, via: websites}
        - {kind: has_many, target: Scan, via: scans}
        - {kind: has_many, target: Tracker, via: "/external/tracker/inventory/{cmId}"}
      docs: https://trustarchelp.zendesk.com/hc/en-us/articles/53517557106963-API-Reference
id_conventions:
  - form: UUID v4
    note: Every documented identifier across Guardian, IRM, CPM, CCM and Hub is a bare UUID with no type prefix.
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  - form: dual-key
    note: >-
      Hub external-integration resources are addressable by BOTH TrustArc's internalId and
      the customer's own externalId, with parallel endpoint families for each. This is the
      integration seam that lets a customer system stay the system of record.
