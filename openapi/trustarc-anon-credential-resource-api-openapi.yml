openapi: 3.2.0
info:
  title: Guardian Anon Credential Resource API
  description: Guardian Authentication
  version: v1
servers:
- url: https://login.truste.com
  description: Generated server url
tags:
- name: anon-credential-resource
paths:
  /services/anonymous/user/{username}/password/reset:
    post:
      tags:
      - anon-credential-resource
      operationId: resetPassword
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      security:
      - guardianAuth: []
      summary: Reset password
      x-summary-source: derived
  /services/anonymous/user/password/reset:
    post:
      tags:
      - anon-credential-resource
      operationId: resetPasswordInQuery
      parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      security:
      - guardianAuth: []
      summary: Reset password in query
      x-summary-source: derived
components:
  securitySchemes:
    guardianAuth:
      type: oauth2
      scheme: bearer
      bearerFormat: JWT
      flows:
        implicit:
          authorizationUrl: https://login.truste.com/oauth/authorize
          tokenUrl: https://login.truste.com/oauth/token
          scopes:
            openid: OpenID
