      - type: OpenIDConnect
        url: https://login.truste.com/.well-known/openid-configuration
  - name: TrustArc Cookie Consent Manager External API
    description: >-
      Manage the website inventory of a Cookie Consent Manager instance and queue tracker
      scans. Version v1.0, released 2025-04-23, with a published versioning policy (URI
      versioning, 12-month support for superseded major versions), a dated changelog and a
      troubleshooting reference. Endpoints add and remove websites against a cmUuid, queue
      asynchronous cookie scans, and read the tracker inventory. Returns per-item result
      arrays with 207 Multi-Status on partial success. Requires SUPER_ADMIN, ADMIN or
      DESIGNER. No OpenAPI is published. The base host is per-tenant: TrustArc's own API
      reference writes it as https://<your-ccm-domain>/external/v1, so the templated form is
      recorded rather than a guessed shared host.
    humanURL: https://trustarchelp.zendesk.com/hc/en-us/articles/53517557106963-API-Reference
    baseURL: https://{your-ccm-domain}
    tags:
      - Cookie Consent
      - Consent Management
      - Tracker Scanning
      - Privacy
    properties:
      - type: APIReference
        url: https://trustarchelp.zendesk.com/hc/en-us/articles/53517557106963-API-Reference
      - type: GettingStarted
        url: https://trustarchelp.zendesk.com/hc/en-us/articles/53517235461651-Getting-Started
      - type: ChangeLog
        url: https://trustarchelp.zendesk.com/hc/en-us/articles/53518189041043-API-Versioning-Changelog
      - type: Support
        url: https://trustarchelp.zendesk.com/hc/en-us/articles/53518128482707-FAQs-Troubleshooting
      - type: AgentSkill
        url: skills/trustarc-cookie-consent-website-scan.md
      - type: ErrorCatalog
        url: errors/trustarc-problem-types.yml
  - name: TrustArc Individual Rights Manager External API
    description: >-
      Create, label, search and close data subject requests (DSR/DSAR) in Individual Rights
      Manager, and register callbacks for request status changes. Request bodies are keyed by
      per-form field IDs discovered from GET /api/v1/external/forms/all rather than by
      display labels. Includes request status and verification-type references, custom label
      management, request task operations, and an external callback controller filtered by
      request type, form, data subject type, status, brand, jurisdiction and verification
      type. Documented in the help center; no OpenAPI is published.
    humanURL: https://trustarchelp.zendesk.com/hc/en-us/articles/52354102146579-DROP-Process-to-IRM-API-Integration-Guide
    baseURL: https://irm.trustarc.com/server/api/v1
    tags:
      - Data Subject Rights
      - DSR
      - DSAR
      - Privacy
      - Webhooks
    properties:
      - type: Documentation
        url: https://trustarchelp.zendesk.com/hc/en-us/articles/52354102146579-DROP-Process-to-IRM-API-Integration-Guide
      - type: APIReference
        url: https://trustarchelp.zendesk.com/hc/en-us/sections/31910350237203-Individual-Rights-RESTful-API-Overview
      - type: Webhooks
        url: asyncapi/trustarc-webhooks.yml
      - type: AgentSkill
        url: skills/trustarc-dsr-request-lifecycle.md
  - name: TrustArc Consent & Preference Manager External API
    description: >-
      Read and write consent records, consent forms, data subjects and their callbacks in
      Consent & Preference Manager, with a matching EU data-residency deployment at
      cpm.trustarc.eu. Exposes external consent, consent form, data subject and report
      controllers plus consent and data-subject callback registration filtered by account,
      brand, program, consent form and data subject type. A real-time consent enqueue
      endpoint shipped in the 2026-07-15 release. Also offers Rapid API, a customer-authored
      integration template for connecting CPM to third-party systems over REST.
    humanURL: https://trustarchelp.zendesk.com/hc/en-us/articles/40520220419475-External-Consent-Controller
    baseURL: https://cpm.trustarc.com/server/api/v1
    tags:
      - Consent Management
      - Preference Management
      - Privacy
      - Webhooks
    properties:
      - type: Documentation
        url: https://trustarchelp.zendesk.com/hc/en-us/articles/40520220419475-External-Consent-Controller
      - type: Webhooks
        url: asyncapi/trustarc-webhooks.yml
  - name: TrustArc Data Mapping Hub External Integration API
    description: >-
      Synchronize the privacy data inventory — Business Processes, IT Systems, Company
      Affiliates and Third Parties — between a customer system of record and TrustArc's Data
      Mapping & Risk Manager. Every resource is addressable by both TrustArc's internalId and
      the customer's own externalId, with upsert operations keyed on externalId, and each
      resource exposes a dated change-event feed (integration-events) filtered by eventType
      and a since timestamp for incremental sync. Paginated with the Spring Data page
      envelope. Documented in the help center; no OpenAPI is published.
    humanURL: https://trustarchelp.zendesk.com/hc/en-us/articles/49882097212435-Retrieve-All-Business-Processes
    baseURL: https://api.trustarc.com/api/hub/external-integration
    tags:
      - Data Mapping
      - Data Inventory
      - Privacy Governance
      - Third Party Risk
    properties:
      - type: Documentation
        url: https://trustarchelp.zendesk.com/hc/en-us/articles/49882097212435-Retrieve-All-Business-Processes
      - type: Authentication
        url: authentication/trustarc-authentication.yml
      - type: DataModel
        url: data-model/trustarc-data-model.yml
  - name: TrustArc Cookie Consent Manager Reporting API
    description: >-
      Pull consent analytics out of Cookie Consent Manager — analytics reports, consent
      locations and GDPR reports, in JSON and CSV. Version 1.4 of the guide, last updated
      2026-01-07. Auth server login.truste.com, reporting server
      api.trustarc.com/api/ccm-reporting/.
    humanURL: https://trustarchelp.zendesk.com/hc/en-us/articles/35645279167891-Overview
    baseURL: https://api.trustarc.com/api/ccm-reporting
    tags:
      - Consent Management
      - Reporting
      - Analytics
      - GDPR
    properties:
      - type: Documentation
        url: https://trustarchelp.zendesk.com/hc/en-us/articles/35645279167891-Overview
      - type: Authentication
        url: authentication/trustarc-authentication.yml
  - name: TrustArc Assessment Manager API
    description: >-
      Create Assessment Manager projects (PIA/DPIA/TIA) programmatically over a RESTful
      surface, plus an external-integration project answer endpoint and packaged Salesforce
      and ServiceNow connectors. Documents both a production host (assess.truste.com) and a
      staging host (assess-stage.truste.com). Documented in the help center; no OpenAPI is
      published.
    humanURL: https://trustarchelp.zendesk.com/hc/en-us/articles/38618198125331-Understanding-the-API-Endpoint
    baseURL: https://assess.truste.com/api/v1
    tags:
      - Privacy Assessments
      - PIA
      - DPIA
      - Privacy Governance
    properties:
