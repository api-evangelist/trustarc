domain_standards:
  - id: scim-2.0
    name: SCIM 2.0 (System for Cross-domain Identity Management, RFC 7643 / RFC 7644)
    conforms: true
    market: enterprise identity and user lifecycle provisioning
    evidence: >-
      The Guardian OpenAPI declares the full SCIM 2.0 resource surface under
      /external/api/v2/scim/ — Users, Users/{id}, Groups, Groups/{id} (GET/POST/PUT/
      PATCH/DELETE), plus the three SCIM discovery resources ServiceProviderConfig,
      Schemas, Schemas/{resource}, ResourceTypes and ResourceTypes/{resource}. The
      PATCH request body schema is the SCIM PatchOp message identified by the URN
      urn:ietf:params:scim:api:messages:2.0:PatchOp. Resource schemas ScimUserResource
      and ScimGroupResource carry the SCIM shape (schemas, id, externalId, meta with
      resourceType/created/lastModified/location/version, userName, name, emails,
      active, groups, entitlements, roles, x509Certificates).
    spec_location: openapi/_original/trustarc-guardian-openapi.json#/paths/~1external~1api~1v2~1scim~1Users
    docs:
      - https://trustarchelp.zendesk.com/hc/en-us/articles/45629008459155-User
      - https://trustarchelp.zendesk.com/hc/en-us/articles/45629108192531-Group
      - https://trustarchelp.zendesk.com/hc/en-us/articles/45628936236307-ServiceConfig
      - https://trustarchelp.zendesk.com/hc/en-us/articles/45628918936723-Schema
    note: >-
      A buyer who already speaks SCIM can provision TrustArc users and groups from Okta,
      Entra ID or any SCIM-capable IdP with no bespoke connector. This is a contract-level
      declaration, not a marketing claim — the URN and the discovery resources are in the
      spec itself.
  - id: gpc-global-privacy-control
    name: Global Privacy Control
    conforms: true
    market: consumer privacy signals
    evidence: >-
      TrustArc publishes a GPC recognition script and documents GPC handling in Cookie
      Consent Manager and Individual Rights Manager, including an Enabling GPC Guide with
      appendices.
    docs: https://trustarchelp.zendesk.com/hc/en-us/sections/19171544108947-Global-Privacy-Control-Overview
    note: >-
      A published, documented implementation of a market standard. Recorded separately
      from SCIM because GPC is a browser/consumer signal specification rather than an API
      contract shape.
  - id: google-consent-mode-v2
    name: Google Consent Mode v2
    conforms: true
    market: adtech consent signalling
    evidence: >-
      TrustArc publishes Google Tag Manager templates for Consent Mode v2 in its own
      GitHub org (trustarc-gcm-template-v2, trustarc_gcm_variable_template,
      trustarc-cmp-gcm-template) and documents the ad_storage / analytics_storage /
      ad_user_data / ad_personalization signal mapping.
    docs: https://trustarchelp.zendesk.com/hc/en-us/articles/47015910833555-Google-Consent-Mode-TrustArc
