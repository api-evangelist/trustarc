- name: TrustArc Individual Rights Manager External API
  description: >-
    Create, label, search and close data subject requests (DSR/DSAR) in Individual Rights Manager, and
    register callbacks for request status changes. Request bodies are keyed by per-form field IDs discovered
    from GET /api/v1/external/forms/all rather than by display labels. Includes request status and verification-type
    references, custom label management, request task operations, and an external callback controller
    filtered by request type, form, data subject type, status, brand, jurisdiction and verification type.
    Documented in the help center; no OpenAPI is published.
  humanURL: >-
    https://trustarchelp.zendesk.com/hc/en-us/articles/52354102146579-DROP-Process-to-IRM-API-Integration-Guide
  baseURL: https://irm.trustarc.com/server/api/v1
