openapi: 3.2.0
info:
  title: Guardian Clients Extension License API
  description: Guardian Authentication
  version: v1
servers:
- url: https://login.truste.com
  description: Generated server url
tags:
- name: Clients-Extension-License
paths:
  /api/v1/licenses/identifier/{licenseIdentifier}/attributes/identifier/{attributeIdentifier}:
    get:
      tags:
      - Clients-Extension-License
      operationId: getLincenseAttributes
      parameters:
      - name: licenseIdentifier
        in: path
        required: true
        schema:
          type: string
      - name: attributeIdentifier
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClientExtensionLicenseAttribute'
      security:
      - guardianAuth: []
      summary: Get lincense attributes
      x-summary-source: derived
    post:
      tags:
      - Clients-Extension-License
      operationId: upsert_3
      parameters:
      - name: licenseIdentifier
        in: path
        required: true
        schema:
          type: string
      - name: attributeIdentifier
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientExtensionLicenseAttribute'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClientExtensionLicenseAttribute'
      security:
      - guardianAuth: []
      summary: Upsert 3
      x-summary-source: derived
  /api/v1/licenses/identifier/{identifier}:
    get:
      tags:
      - Clients-Extension-License
      operationId: getByIdentifier
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClientExtensionLicense'
      security:
      - guardianAuth: []
      summary: Get by identifier
      x-summary-source: derived
  /api/v1/licenses/{id}:
    delete:
      tags:
      - Clients-Extension-License
      operationId: delete_20
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
      security:
      - guardianAuth: []
      summary: Delete 20
      x-summary-source: derived
components:
  schemas:
    ClientExtensionLicenseAttribute:
      properties:
        value:
          type: string
        edittable:
          type: boolean
        license:
          $ref: '#/components/schemas/ClientExtensionLicense'
        attribute:
          $ref: '#/components/schemas/ClientExtensionAttribute'
    ClientExtensionLicense:
      properties:
        id:
          type: string
          format: uuid
        identifier:
          type: string
        name:
          type: string
    ClientExtensionAttribute:
      properties:
        id:
          type: string
          format: uuid
        identifier:
          type: string
        displayName:
          type: string
  securitySchemes:
    guardianAuth:
      type: oauth2
      scheme: bearer
      bearerFormat: JWT
      flows:
        implicit:
          authorizationUrl: https://login.truste.com/oauth/authorize
          tokenUrl: https://login.truste.com/oauth/token
          scopes:
            openid: OpenID
