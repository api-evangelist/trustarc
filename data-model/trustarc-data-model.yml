privacy_domain_entities:
  note: >-
    Documented in the help center only — no machine-readable schema is published. Recorded
    from the Hub external-integration guides and the IRM/CPM controller guides.
  entities:
    - name: BusinessProcess
      keys: [internalId, externalId, identifier]
      relationships:
        - {kind: has_many, target: ITSystemEntity, via: itSystems}
        - {kind: has_many, target: DataElement, via: dataFlowDataElements}
        - {kind: has_many, target: DataSubject, via: dataSubjects}
        - {kind: has_many, target: DataRecipient, via: dataRecipients}
        - {kind: has_one, target: DataRetention, via: dataRetention}
        - {kind: has_one, target: Contact, via: contact}
        - {kind: belongs_to, target: Account, via: accountId}
      docs: https://trustarchelp.zendesk.com/hc/en-us/articles/49882097212435-Retrieve-All-Business-Processes
    - name: ITSystem
      keys: [internalId, externalId]
      docs: https://trustarchelp.zendesk.com/hc/en-us/articles/50030327606803-Retrieve-All-IT-Systems
    - name: CompanyAffiliate
      keys: [internalId, externalId]
      docs: https://trustarchelp.zendesk.com/hc/en-us/articles/49946717548947-Retrieve-All-Company-Affiliates
    - name: ThirdParty
      keys: [internalId, externalId]
      docs: https://trustarchelp.zendesk.com/hc/en-us/articles/50035694325523-Retrieve-All-Third-Party
    - name: Request
      domain: Individual Rights Manager
      keys: [id]
      relationships:
        - {kind: belongs_to, target: Form, via: formId}
        - {kind: has_many, target: Label, via: labels}
        - {kind: has_many, target: Task, via: tasks}
        - {kind: belongs_to, target: DataSubjectType, via: dataSubjectTypeId}
      docs: https://trustarchelp.zendesk.com/hc/en-us/articles/52354102146579-DROP-Process-to-IRM-API-Integration-Guide
    - name: Form
      domain: Individual Rights Manager
      note: >-
        Request bodies are keyed by per-form FIELD IDs (UUIDs), not labels. Fields carry
        id, display, type, dataType, required and values.
    - name: Consent
      domain: Consent & Preference Manager
      relationships:
        - {kind: belongs_to, target: ConsentForm, via: consentFormIds}
        - {kind: belongs_to, target: Program, via: programIds}
