- name: TrustArc Consent & Preference Manager External API
  description: >-
    Read and write consent records, consent forms, data subjects and their callbacks in Consent & Preference
    Manager, with a matching EU data-residency deployment at cpm.trustarc.eu. Exposes external consent,
    consent form, data subject and report controllers plus consent and data-subject callback registration
    filtered by account, brand, program, consent form and data subject type. A real-time consent enqueue
    endpoint shipped in the 2026-07-15 release. Also offers Rapid API, a customer-authored integration
    template for connecting CPM to third-party systems over REST.
  humanURL: >-
    https://trustarchelp.zendesk.com/hc/en-us/articles/40520220419475-External-Consent-Controller
  baseURL: https://cpm.trustarc.com/server/api/v1
