openapi: 3.2.0
info:
  title: Guardian Storage API
  description: Guardian Authentication
  version: v1
servers:
- url: https://login.truste.com
  description: Generated server url
tags:
- name: Storage
paths:
  /api/v1/storage:
    post:
      tags:
      - Storage
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredObject'
      security:
      - guardianAuth: []
      summary: Upload
      x-summary-source: derived
    delete:
      tags:
      - Storage
      operationId: deleteAllUnused
      responses:
        '200':
          description: OK
      security:
      - guardianAuth: []
      summary: Delete all unused
      x-summary-source: derived
components:
  schemas:
    StoredObject:
      properties:
        id:
          type: string
          format: uuid
        file:
          type: string
          format: byte
          writeOnly: true
        uri:
          type: string
        type:
          type: string
        createdDate:
          type: string
          format: date-time
  securitySchemes:
    guardianAuth:
      type: oauth2
      scheme: bearer
      bearerFormat: JWT
      flows:
        implicit:
          authorizationUrl: https://login.truste.com/oauth/authorize
          tokenUrl: https://login.truste.com/oauth/token
          scopes:
            openid: OpenID
