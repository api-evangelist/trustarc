        schema: {}
      - name: includeMetaTags
        in: query
        schema: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
      security:
      - guardianAuth: []
    put:
      tags:
      - Accounts
      operationId: update_11
