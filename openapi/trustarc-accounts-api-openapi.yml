components:
  schemas:
    MetaTag:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        required:
          type: boolean
        displayName:
          type: string
    PageUserCredentials:
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserCredentials'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
    PageCustomerAccount:
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/CustomerAccount'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
    UserMetaTag:
      properties:
        id:
          type: string
          format: uuid
        value:
          type: string
        metaTagId:
          type: string
          format: uuid
        metaTagName:
          type: string
    UploadStatus:
      properties:
        message:
          type: string
    ReportStore:
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - EXPORT_USER
          - EXPORT_USER_ACTION
          - EXPORT_USER_AUDIT_EVENTS
          - EXPORT_LOGIN_REPORT
          - EXPORT_FULL_LOGIN_REPORT
          - EXPORT_USER_GROUP
          - EXPORT_NEW_USER_REPORT
        fileName:
          type: string
        file:
          type: string
          format: byte
          writeOnly: true
        fileType:
          type: string
          enum:
          - CSV
        createdDate:
          type: string
          format: date-time
        createdById:
          type: string
        ownerAccountId:
          type: string
    CustomerAccount:
      properties:
        id:
          type: string
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type: string
          format: date-time
        legalName:
          type: string
          minLength: 1
        businessName:
          type: string
        prefixName:
          type: string
        logo:
          type: string
        confirmMessage:
          type: string
        mailingAsPhysical:
          type: boolean
        netSuiteId:
          type: string
        nymityId:
          type: string
        status:
          type: string
          enum:
          - Active
          - Inactive
        allowedDomains:
          type: string
        internalOnly:
          type: boolean
        mailingAddress:
          $ref: '#/components/schemas/Address'
        physicalAddress:
          $ref: '#/components/schemas/Address'
        businessType:
          type: array
          items:
            type: string
            enum:
            - Internet
            - Manufacturing
            - Automotive
            - Banking
            - Finance
            - Pharmaceutical
            - Advertising
            - Government
            - Telecommunications
            - Insurance
            - Travel
            - Energy
            - Technology
            - Consumer
            - Electronics
            - Other
          uniqueItems: true
        industryType:
          type: array
          items:
            type: string
            enum:
            - ProfessionalServices
            - Scientific
            - TechnicalServices
            - Legal
            - Shopping
            - MediaAndEntertainment
            - BusinessServices
            - ComputerAndElectronics
            - ConsumerServices
            - Education
            - EnergyAndUtilities
            - FinancialServices
            - Government
            - Health
            - PharmaceuticalsAndBiotech
            - Retail
            - SoftwareAndInternet
            - TransportationAndStorage
            - TravelRecreationAndLeisure
            - WholesaleAndDistribution
            - RealEstateAndConstruction
            - AgricultureAndMining
            - Other
          uniqueItems: true
        application:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/ClientApplication'
            - $ref: '#/components/schemas/CustomerClientApplication'
            - $ref: '#/components/schemas/InternalClientApplication'
          uniqueItems: true
        extension:
          $ref: '#/components/schemas/CustomerAccountExtension'
        type:
          type: string
          enum:
          - Default
          - Reseller
        userCount:
          type: integer
          format: int64
        metaTags:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetaTag'
        modifiedById:
          type: string
      required:
      - legalName
    BatchJobError:
      properties:
        entry:
          type: string
        message:
          type: string
    GrantedAuthority:
      properties:
        authority:
          type: string
    UserExtensionDTO:
      properties:
        userMgrId:
          type: string
        timeZone:
          type: string
        locale:
          type: string
        totpEnabled:
          type: boolean
    BatchJob:
      properties:
        id:
          type: string
        jobInstanceId:
          type: integer
          format: int64
        jobExecutionId:
          type: integer
          format: int64
        createTime:
          type: string
          format: date-time
        lastRunTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        currentStatus:
          type: string
        resourceName:
          type: string
        batchJobType:
          type: string
          enum:
          - DELETE_USER
          - IMPORT_ORG
          - IMPORT_USER
          - EXPORT_USER
          - EXPORT_USER_ACTION
          - EXPORT_USER_AUDIT_EVENTS
          - REFRESH_USER_SEARCH
          - RUN_TASK
          - TASK_UNMANAGE_PASSWORD
          - TASK_RESET_PASSWORD
          - TASK_UPDATE_PERMISSION
          - TASK_REFRESH_USER_CACHE
          - TASK_REFRESH_USER_META_CACHE
