note: >-
  TrustArc's OAuth surface is effectively scope-free. The published discovery document
  declares scopes_supported: ["openid"] and nothing else, and the Guardian OpenAPI declares
  the same single scope. The token response echoes "openid profile email", but profile and
  email are not advertised as grantable scopes in discovery. Authorization is decided by
  ROLE (SUPER_ADMIN / ADMIN / DESIGNER), not by scope — see
  authentication/trustarc-authentication.yml. No scopes or permissions reference page exists
  in the TrustArc help center; the search returned none. Nothing invented to fill the gap.
