- name: TrustArc Data Mapping Hub External Integration API
  description: >-
    Synchronize the privacy data inventory — Business Processes, IT Systems, Company Affiliates and Third
    Parties — between a customer system of record and TrustArc's Data Mapping & Risk Manager. Every resource
    is addressable by both TrustArc's internalId and the customer's own externalId, with upsert operations
    keyed on externalId, and each resource exposes a dated change-event feed (integration-events) filtered
    by eventType and a since timestamp for incremental sync. Paginated with the Spring Data page envelope.
    Documented in the help center; no OpenAPI is published.
  humanURL: >-
    https://trustarchelp.zendesk.com/hc/en-us/articles/49882097212435-Retrieve-All-Business-Processes
  baseURL: https://api.trustarc.com/api/hub/external-integration
  tags:
