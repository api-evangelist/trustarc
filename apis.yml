apis:
- name: TrustArc Cookie Consent Manager External API
  description: >-
    Manage the website inventory of a Cookie Consent Manager instance and queue tracker scans. Version
    v1.0, released 2025-04-23, with a published versioning policy (URI versioning, 12-month support for
    superseded major versions), a dated changelog and a troubleshooting reference. Endpoints add and remove
    websites against a cmUuid, queue asynchronous cookie scans, and read the tracker inventory. Returns
    per-item result arrays with 207 Multi-Status on partial success. Requires SUPER_ADMIN, ADMIN or DESIGNER.
    No OpenAPI is published. The base host is per-tenant: TrustArc's own API reference writes it as https://<your-ccm-domain>/external/v1,
    so the templated form is recorded rather than a guessed shared host.
  humanURL: https://trustarchelp.zendesk.com/hc/en-us/articles/53517557106963-API-Reference
  baseURL: https://{your-ccm-domain}
  tags:
  - Cookie Consent
  - Consent Management
  - Tracker Scanning
  - Privacy
